<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">

  <defs>
    <radialGradient id="sea_polarVortex" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#0b1c2e"/>
      <stop offset="60%" stop-color="#081524"/>
      <stop offset="100%" stop-color="#040c17"/>
    </radialGradient>
    <linearGradient id="ice_polarVortex" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(190,225,245,0.30)"/>
      <stop offset="100%" stop-color="rgba(130,175,205,0.18)"/>
    </linearGradient>
    <linearGradient id="vig_polarVortex" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.35)"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="100" height="100" fill="url(#sea_polarVortex)"/>
  <g><line x1="10" y1="0" x2="10" y2="100" stroke="rgba(110,170,200,0.14)" stroke-width="0.12"/><line x1="0" y1="10" x2="100" y2="10" stroke="rgba(110,170,200,0.14)" stroke-width="0.12"/><line x1="20" y1="0" x2="20" y2="100" stroke="rgba(150,215,240,0.22)" stroke-width="0.18"/><line x1="0" y1="20" x2="100" y2="20" stroke="rgba(150,215,240,0.22)" stroke-width="0.18"/><line x1="30" y1="0" x2="30" y2="100" stroke="rgba(110,170,200,0.14)" stroke-width="0.12"/><line x1="0" y1="30" x2="100" y2="30" stroke="rgba(110,170,200,0.14)" stroke-width="0.12"/><line x1="40" y1="0" x2="40" y2="100" stroke="rgba(150,215,240,0.22)" stroke-width="0.18"/><line x1="0" y1="40" x2="100" y2="40" stroke="rgba(150,215,240,0.22)" stroke-width="0.18"/><line x1="50" y1="0" x2="50" y2="100" stroke="rgba(110,170,200,0.14)" stroke-width="0.12"/><line x1="0" y1="50" x2="100" y2="50" stroke="rgba(110,170,200,0.14)" stroke-width="0.12"/><line x1="60" y1="0" x2="60" y2="100" stroke="rgba(150,215,240,0.22)" stroke-width="0.18"/><line x1="0" y1="60" x2="100" y2="60" stroke="rgba(150,215,240,0.22)" stroke-width="0.18"/><line x1="70" y1="0" x2="70" y2="100" stroke="rgba(110,170,200,0.14)" stroke-width="0.12"/><line x1="0" y1="70" x2="100" y2="70" stroke="rgba(110,170,200,0.14)" stroke-width="0.12"/><line x1="80" y1="0" x2="80" y2="100" stroke="rgba(150,215,240,0.22)" stroke-width="0.18"/><line x1="0" y1="80" x2="100" y2="80" stroke="rgba(150,215,240,0.22)" stroke-width="0.18"/><line x1="90" y1="0" x2="90" y2="100" stroke="rgba(110,170,200,0.14)" stroke-width="0.12"/><line x1="0" y1="90" x2="100" y2="90" stroke="rgba(110,170,200,0.14)" stroke-width="0.12"/></g>

  <!-- polar ice shelf, north -->
  <path d="M -2 -2 L 102 -2 L 102 16 Q 88 20 76 17 Q 64 14 55 19 Q 44 25 33 20 Q 20 15 10 19 Q 3 21 -2 18 Z"
        fill="url(#ice_polarVortex)" stroke="rgba(200,235,250,0.45)" stroke-width="0.35"/>
  <!-- fjord landmass, west -->
  <path d="M -2 34 Q 8 32 13 38 Q 18 44 12 49 Q 6 53 11 58 Q 17 63 12 69 Q 6 74 -2 72 Z"
        fill="url(#ice_polarVortex)" stroke="rgba(200,235,250,0.40)" stroke-width="0.30"/>
  <!-- glacier archipelago, center-east -->
  <path d="M 62 44 Q 70 40 78 44 Q 85 48 82 55 Q 78 61 69 60 Q 60 58 60 51 Q 60 46 62 44 Z"
        fill="url(#ice_polarVortex)" stroke="rgba(200,235,250,0.40)" stroke-width="0.30"/>
  <path d="M 84 62 Q 90 60 94 64 Q 97 68 93 71 Q 88 74 84 70 Q 81 66 84 62 Z"
        fill="url(#ice_polarVortex)" stroke="rgba(200,235,250,0.35)" stroke-width="0.25"/>
  <!-- drifting ice floes -->
  <g fill="rgba(185,222,242,0.20)" stroke="rgba(200,235,250,0.30)" stroke-width="0.18">
    <polygon points="30,38 35,36 38,40 34,43 29,42"/>
    <polygon points="46,60 51,58 54,62 50,66 45,64"/>
    <polygon points="24,76 30,74 33,78 28,82 22,80"/>
    <polygon points="56,82 61,80 64,84 60,87 55,86"/>
    <polygon points="72,26 76,24 79,27 76,31 71,29"/>
  </g>
  <!-- crevasse contour hints -->
  <g stroke="rgba(140,195,225,0.25)" stroke-width="0.22" fill="none">
    <path d="M 6 42 Q 10 45 8 50"/>
    <path d="M 66 48 Q 72 50 76 47"/>
    <path d="M 40 12 Q 46 15 52 12"/>
  </g>
  <rect x="0" y="0" width="100" height="100" fill="url(#vig_polarVortex)"/>
</svg>

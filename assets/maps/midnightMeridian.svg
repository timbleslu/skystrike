      <stop offset="0%" stop-color="#12202c"/>
      <stop offset="100%" stop-color="#0a1622"/>
    </radialGradient>
    <linearGradient id="vig_midnightMeridian" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.35)"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="100" height="100" fill="url(#sea_midnightMeridian)"/>
  <g><line x1="10" y1="0" x2="10" y2="100" stroke="rgba(90,150,180,0.14)" stroke-width="0.12"/><line x1="0" y1="10" x2="100" y2="10" stroke="rgba(90,150,180,0.14)" stroke-width="0.12"/><line x1="20" y1="0" x2="20" y2="100" stroke="rgba(120,200,230,0.22)" stroke-width="0.18"/><line x1="0" y1="20" x2="100" y2="20" stroke="rgba(120,200,230,0.22)" stroke-width="0.18"/><line x1="30" y1="0" x2="30" y2="100" stroke="rgba(90,150,180,0.14)" stroke-width="0.12"/><line x1="0" y1="30" x2="100" y2="30" stroke="rgba(90,150,180,0.14)" stroke-width="0.12"/><line x1="40" y1="0" x2="40" y2="100" stroke="rgba(120,200,230,0.22)" stroke-width="0.18"/><line x1="0" y1="40" x2="100" y2="40" stroke="rgba(120,200,230,0.22)" stroke-width="0.18"/><line x1="50" y1="0" x2="50" y2="100" stroke="rgba(90,150,180,0.14)" stroke-width="0.12"/><line x1="0" y1="50" x2="100" y2="50" stroke="rgba(90,150,180,0.14)" stroke-width="0.12"/><line x1="60" y1="0" x2="60" y2="100" stroke="rgba(120,200,230,0.22)" stroke-width="0.18"/><line x1="0" y1="60" x2="100" y2="60" stroke="rgba(120,200,230,0.22)" stroke-width="0.18"/><line x1="70" y1="0" x2="70" y2="100" stroke="rgba(90,150,180,0.14)" stroke-width="0.12"/><line x1="0" y1="70" x2="100" y2="70" stroke="rgba(90,150,180,0.14)" stroke-width="0.12"/><line x1="80" y1="0" x2="80" y2="100" stroke="rgba(120,200,230,0.22)" stroke-width="0.18"/><line x1="0" y1="80" x2="100" y2="80" stroke="rgba(120,200,230,0.22)" stroke-width="0.18"/><line x1="90" y1="0" x2="90" y2="100" stroke="rgba(90,150,180,0.14)" stroke-width="0.12"/><line x1="0" y1="90" x2="100" y2="90" stroke="rgba(90,150,180,0.14)" stroke-width="0.12"/></g>
  
    <g>
      <!-- highland landmass (fills frame, sea only at corners) -->
      <path d="M-2 14 L20 8 L44 12 L70 7 L96 13 L102 30 L98 60 L102 88 L70 96 L40 92 L14 96 L-2 86 Z"

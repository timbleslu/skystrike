      <path d="M22 20 L40 26 L60 20 L80 28" fill="none" stroke="#5a7488" stroke-width="0.3" stroke-dasharray="0.6 1.2"/>
      <path d="M16 64 L38 70 L62 66 L84 72" fill="none" stroke="#5a7488" stroke-width="0.3" stroke-dasharray="0.6 1.2"/>
    </g>
  <g><circle cx="50" cy="30" r="14" fill="none" stroke="rgba(120,200,230,0.16)" stroke-width="0.14" stroke-dasharray="1.4 1.8"/><circle cx="50" cy="30" r="26" fill="none" stroke="rgba(120,200,230,0.16)" stroke-width="0.14" stroke-dasharray="1.4 1.8"/><circle cx="50" cy="30" r="38" fill="none" stroke="rgba(120,200,230,0.16)" stroke-width="0.14" stroke-dasharray="1.4 1.8"/><line x1="47" y1="30" x2="53" y2="30" stroke="rgba(150,200,225,0.55)" stroke-width="0.16"/><line x1="50" y1="27" x2="50" y2="33" stroke="rgba(150,200,225,0.55)" stroke-width="0.16"/></g>
  <g opacity="0.7">
    <circle cx="88" cy="14" r="6" fill="none" stroke="rgba(120,170,200,0.32)" stroke-width="0.16"/>
    <path d="M88 8 L89.3 14 L88 20 L86.7 14 Z" fill="rgba(210,150,60,0.32)" stroke="rgba(150,200,225,0.55)" stroke-width="0.1"/>
    <path d="M82 14 L88 12.7 L94 14 L88 15.3 Z" fill="rgba(120,200,230,0.18)" stroke="rgba(120,170,200,0.32)" stroke-width="0.1"/>
    <text x="88" y="6.8" fill="rgba(150,200,225,0.55)" font-size="2.4" font-family="monospace" text-anchor="middle">N</text>
  </g>
  <text x="50" y="18" fill="rgba(120,170,200,0.32)" font-size="2.5" letter-spacing="0.4" font-family="monospace" text-anchor="middle">VOSTOK RIDGE</text><text x="48" y="45" fill="rgba(120,170,200,0.32)" font-size="2.5" letter-spacing="0.4" font-family="monospace" text-anchor="middle">FROZEN VALLEY</text><text x="8" y="90" fill="rgba(120,170,200,0.32)" font-size="2.5" letter-spacing="0.4" font-family="monospace" text-anchor="start">EXFIL</text><text x="92" y="12" fill="rgba(120,170,200,0.32)" font-size="2.5" letter-spacing="0.4" font-family="monospace" text-anchor="end">FORWARD EDGE</text>
  <rect x="0" y="0" width="100" height="100" fill="url(#vig_midnightMeridian)"/>
  <rect x="0.4" y="0.4" width="99.2" height="99.2" fill="none" stroke="rgba(120,200,230,0.22)" stroke-width="0.4"/>
  <text x="3" y="96.5" fill="rgba(120,170,200,0.32)" font-size="2.5" letter-spacing="0.4" font-family="monospace" text-anchor="start">VOSTOK HIGHLANDS // WINTER RIDGELINE</text>
